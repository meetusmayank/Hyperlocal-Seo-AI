    return [
      { name: 'Google Business Profile', key: true, cls: 'ok', status: 'No issues', det: 'Name, address and phone match' },
      { name: 'Bing Places', key: true, cls: 'bad', status: 'Not present', det: 'Missed opportunity · high-traffic directory', fix: 'Add listing' },
      { name: 'Apple Business Connect', key: true, cls: 'bad', status: 'Not present', det: 'Missed opportunity · Apple Maps and Siri', fix: 'Add listing' },
      { name: 'Facebook', key: true, cls: 'warn', status: 'Wrong phone', det: 'Shows +91 120 455 0198', fix: 'Fix' },
      { name: 'Justdial', key: true, cls: 'warn', status: 'Duplicate', det: '2 listings for the same location', fix: 'Merge' },
      { name: 'Instagram', key: false, cls: 'warn', status: 'No address', det: 'Profile has no location set', fix: 'Fix' },
      { name: 'Yelp', key: false, cls: 'ok', status: 'No issues', det: 'Name, address and phone match' },
      { name: 'Foursquare', key: false, cls: 'warn', status: 'Missing hours', det: 'Opening hours not listed', fix: 'Fix' },
      { name: 'Sulekha', key: false, cls: 'bad', status: 'Not present', det: 'Missed opportunity · local services directory', fix: 'Add listing' },
      { name: 'HERE WeGo', key: false, cls: 'bad', status: 'Not present', det: 'Missed opportunity · in-car navigation', fix: 'Add listing' },
      { name: 'TomTom', key: false, cls: 'bad', status: 'Not present', det: 'Missed opportunity · maps data provider', fix: 'Add listing' },
      { name: 'Waze', key: false, cls: 'warn', status: 'Old address', det: 'Pin placed at previous location', fix: 'Fix' }
    ];
  }

  startScan(biz) {
    clearInterval(this.iv); clearTimeout(this.to);
    this.setState({ step: 'scan', biz, scanI: 0, showAll: false, copied: false, err: '' });
    this.top();
    const n = this.dirs().length;
    this.iv = setInterval(() => {
      const i = this.state.scanI + 1;
      if (i >= n) {
        clearInterval(this.iv);
        this.setState({ scanI: n });
        this.to = setTimeout(() => { this.setState({ step: 'result' }); this.top(); }, 600);
      } else this.setState({ scanI: i });
    }, 280);
  }

  mkBiz(name, addr, cat, kw) {
    const s = name.length;
    return { name, addr, cat, kw: kw || 'dentist near me', phone: '+91 120 455 0189', rating: (4.0 + (s % 5) / 10).toFixed(1), reviews: String(180 + s * 11), gbp: 60 + (s % 15) };
  }

  renderVals() {
    const st = this.state;
    const dirs = this.dirs();
    const n = dirs.length;
    const titleCase = (t) => t.replace(/\s+/g, ' ').trim().replace(/\b\w/g, (c) => c.toUpperCase());

    const submitSearch = (ev) => {
      if (ev && ev.preventDefault) ev.preventDefault();
      const q = (st.adv ? st.f.name : st.q).trim();
      if (q.length < 2) { this.setState({ err: st.adv ? 'Enter your business name to continue.' : 'Enter your business name or address to start the scan.' }); return; }
      if (st.adv) {
        const addr = [st.f.addr, st.f.pin].filter(Boolean).join(', ') || 'Address from your details';
        const b = this.mkBiz(titleCase(q), addr, 'Local business');
        if (st.f.phone) b.phone = st.f.phone;
        this.startScan(b);
        return;
      }
      this.setState({ step: 'pick', err: '' });
      this.top();
    };

    const qt = titleCase(st.q || 'Your Business');
    const mSrc = [
      [qt, 'Sector 18, Noida, Uttar Pradesh 201301', 'Best match'],
      [qt + ' – Sector 62', 'Sector 62, Noida, Uttar Pradesh 201309', 'Branch'],
      [qt + ' Clinic & Studio', 'DLF Phase 3, Gurugram, Haryana 122002', 'Similar name']
    ];
    const matches = mSrc.map((m) => ({ name: m[0], addr: m[1], cat: m[2], pick: () => this.startScan(this.mkBiz(m[0], m[1], m[2])) }));

    const samples = [
      ['IN', 'Dental clinic in Noida', ['Northside Dental Clinic', 'C-24, Sector 18, Noida, Uttar Pradesh 201301', 'Dental clinic', 'dentist near me']],
      ['IN', 'Salon in Bengaluru', ['Bloom Hair & Beauty Studio', '12th Main, Indiranagar, Bengaluru 560038', 'Beauty salon', 'salon near me']],
      ['AE', 'Restaurant in Dubai', ['Saffron Courtyard Kitchen', 'Al Wasl Road, Jumeirah 1, Dubai', 'Restaurant', 'indian restaurant near me']]
    ].map((s) => ({ cc: s[0], label: s[1], go: () => this.startScan(this.mkBiz(s[2][0], s[2][1], s[2][2], s[2][3])) }));

    const scanList = dirs.map((d, i) => ({ name: d.name, cls: i < st.scanI ? 'ok' : (i === st.scanI ? 'run' : 'wait') }));
    const rpts = [[30, 28], [68, 22], [78, 58], [22, 66], [52, 80], [40, 40], [62, 44], [16, 42], [84, 34], [46, 18], [72, 76], [30, 84]];
    const radar = rpts.map((p, i) => ({ x: p[0] + '%', y: p[1] + '%', cls: i < st.scanI ? 'on' : '' }));
    const pct = Math.round(st.scanI / n * 100);

    const rows = (st.showAll ? dirs : dirs.slice(0, 8)).map((d) => ({ name: d.name, key: d.key, cls: d.cls, status: d.status, det: d.det, fix: d.fix || '' }));
    const missing = dirs.filter((d) => d.cls === 'bad').length;
    const errors = dirs.filter((d) => d.cls === 'warn').length;

    const grid = [];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
      const d = Math.sqrt((r - 2) * (r - 2) + (c - 2) * (c - 2));
      const v = Math.round(1 + d * 3 + ((r * 7 + c * 3) % 4));
      grid.push(r >= 3 ? { label: '', cls: 'lock' } : { label: v > 20 ? '20+' : String(v), cls: v <= 3 ? 'g1' : v <= 7 ? 'g2' : v <= 13 ? 'g3' : 'g4' });
    }

    const AUD = {
      smb: { label: 'Small businesses', title: 'Look like the best choice on the map — without hiring an agency', desc: 'Run your Google Business Profile, listings and reviews in about an hour a week, with automations and AI doing the routine work.', points: ['Free scan of your local presence', 'AI-drafted posts and review replies', 'Automatic review requests after each visit', 'Simple weekly to-do list'] },
      multi: { label: 'Multi-location brands', title: 'Keep every location accurate and visible', desc: 'Manage hundreds of profiles and listings in bulk, protect them from unwanted edits, and compare performance by location.', points: ['Bulk listing and GBP updates', 'Location-level map rank tracking', 'Review inbox across all locations', 'Weak service-area detection'] },
      agency: { label: 'Agencies', title: 'Deliver local SEO results clients can see', desc: 'Onboard clients with a free scan, manage every account from one place, and give each client their own dashboard login.', points: ['Free scan as a sales tool', 'Client dashboard logins', 'Website SEO + Local SEO in one report', 'Automations across client accounts'] }
    };
    const audTabs = ['smb', 'multi', 'agency'].map((k) => ({ label: AUD[k].label, sel: st.aud === k ? 'true' : 'false', cls: st.aud === k ? 'on' : '', pick: () => this.setState({ aud: k }) }));

    const FAQ = [
      ['What does the free local scan check?', 'It checks whether your business appears on major directories, whether your name, address and phone match, your Google rating and review count, and how complete your Google Business Profile is.'],
      ['What is included in the Local toolkit?', 'Listing Management, Review Management, GBP Optimization, Automations, the GBP AI Agent, Competitive Analysis and the Map Rank Tracker — all in the Local section of the dashboard.'],
      ['Can I use Local SEO without the website SEO tools?', 'Yes. You can start with Local only and add Website SEO, technical audits and GSC, GA4, GTM and UTM reporting whenever you need them.'],
      ['Do you support businesses with multiple locations?', 'Yes. You can manage every location from one account, update listings and profiles in bulk, and compare performance location by location.'],
      ['Is there a plan for agencies?', 'Yes. Agencies can manage multiple client accounts and give each client their own dashboard login.'],
      ['Which countries are supported?', '[List of supported countries and directories]']
    ];
    const faqs = FAQ.map((f, i) => ({ q: f[0], a: f[1], open: st.faq === i, exp: st.faq === i ? 'true' : 'false', cls: st.faq === i ? 'open' : '', toggle: () => this.setState({ faq: st.faq === i ? -1 : i }) }));

    const biz = st.biz || this.mkBiz('Northside Dental Clinic', 'C-24, Sector 18, Noida 201301', 'Dental clinic');
    const bizV = Object.assign({}, biz, { gbpW: biz.gbp + '%' });
    const set = (k) => (ev) => this.setState({ f: Object.assign({}, st.f, { [k]: ev.target.value }) });

    return {
      isStart: st.step === 'start', inFlow: st.step !== 'start',
      isPick: st.step === 'pick', isScan: st.step === 'scan', isResult: st.step === 'result',
      sp1: st.step === 'pick' ? 'cur' : 'done', sp2: st.step === 'scan' ? 'cur' : (st.step === 'result' ? 'done' : ''), sp3: st.step === 'result' ? 'cur' : '',
      q: st.q, onQ: (ev) => this.setState({ q: ev.target.value, err: '' }),
      simple: !st.adv, advOpen: st.adv, advCls: st.adv ? 'open' : '', advAria: st.adv ? 'true' : 'false',
      advLabel: st.adv ? 'Hide advanced search' : 'Advanced search',
      toggleAdv: () => this.setState({ adv: !st.adv, err: '' }),
      openAdv: () => { this.setState({ step: 'start', adv: true, f: Object.assign({}, st.f, { name: st.q }) }); this.top(); },
      fCountry: st.f.country, fName: st.f.name, fAddr: st.f.addr, fPin: st.f.pin, fPhone: st.f.phone,
      onCountry: set('country'), onFName: set('name'), onFAddr: set('addr'), onFPin: set('pin'), onFPhone: set('phone'),
      submitSearch, hasErr: !!st.err, err: st.err,
      samples, matches, qShown: st.q.trim(),
      goStart: () => { clearInterval(this.iv); this.setState({ step: 'start' }); this.top(); },
      reset: () => { clearInterval(this.iv); clearTimeout(this.to); this.setState({ step: 'start', q: '', biz: null, err: '' }); this.top(); },
      biz: bizV, scanList, radar, scanPct: pct, scanW: pct + '%', scanDone: Math.min(st.scanI, n), dirCount: n,
      dirRows: rows, allLabel: st.showAll ? 'Show fewer' : 'Show all ' + n + ' directories', toggleAll: () => this.setState({ showAll: !st.showAll }),
      toFix: missing + errors, missing, errors, gbpGain: Math.min(12, 100 - biz.gbp),
      copyLabel: st.copied ? 'Link copied' : 'Copy link',
      copyLink: () => { try { if (navigator.clipboard) navigator.clipboard.writeText(window.location.href); } catch (e) {} this.setState({ copied: true }); },
      gridPrev: grid, audTabs, aud: AUD[st.aud], faqs
    };
  }
}

  render(html`<${Component} />`, document.getElementById('app'));
})();
</script>
<div class="dashboard-modal" id="dashboard-choice" hidden>
  <div class="dashboard-modal-backdrop" data-dashboard-close></div>
  <section class="dashboard-dialog" role="dialog" aria-modal="true" aria-labelledby="dashboard-choice-title">
    <button class="dashboard-close" type="button" aria-label="Close" data-dashboard-close>&times;</button>
    <div class="dashboard-dialog-head">
      <span class="dashboard-kicker">LOCAL AI</span>
      <h2 id="dashboard-choice-title">Choose your dashboard</h2>
      <p>Start a free audit in the workspace you need.</p>
    </div>
    <div class="dashboard-options">
      <a class="dashboard-option website" href="https://seo.hyperlocalseoai.com/login">
        <span class="dashboard-option-icon"><span class="brand-mark"><img src="assets/local-ai-logo.png" alt="" /></span></span>
        <span class="dashboard-option-copy"><b>Website SEO</b><small>Technical audits, search performance and website visibility.</small></span><span class="dashboard-option-action">Open <i>&rarr;</i></span>
      </a>
      <a class="dashboard-option local" href="https://gbp.hyperlocalseoai.com/">
        <span class="dashboard-option-icon"><span class="brand-mark"><img src="assets/local-ai-logo.png" alt="" /></span></span>
        <span class="dashboard-option-copy"><b>Local SEO</b><small>Google Business Profile, listings, reviews and map rankings.</small></span><span class="dashboard-option-action">Open <i>&rarr;</i></span>
      </a>
    </div>
    <p class="dashboard-help">You can switch between both dashboards whenever you need.</p>
  </section>
</div><script>
(() => {
  const modal = document.getElementById('dashboard-choice');
  if (!modal) return;
  const openModal = () => { modal.hidden = false; document.body.classList.add('dashboard-modal-open'); modal.querySelector('.dashboard-close').focus(); };
  const closeModal = () => { modal.hidden = true; document.body.classList.remove('dashboard-modal-open'); };
  document.querySelectorAll('a, button').forEach((el) => {
    const label = el.textContent.replace(/\s+/g, ' ').trim();
    if (label.indexOf('Start Free Audit') === 0) el.addEventListener('click', (event) => { event.preventDefault(); openModal(); });
  });
  modal.querySelectorAll('[data-dashboard-close]').forEach((el) => el.addEventListener('click', closeModal));
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !modal.hidden) closeModal(); });
})();
</script></body>
</html>
